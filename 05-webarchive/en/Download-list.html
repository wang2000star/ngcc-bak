<script>
$(function () {

  var pageSize = 8; // 每页显示数量

  // ★新增★ 判断是否添加新图标（NEW）的函数
  function getNewIcon(pubDateStr) {
    var now = new Date();
    var pubDate = new Date(pubDateStr.replace(/-/g, '/'));

    // 计算完整的日历月份差
    var yearDiff = now.getFullYear() - pubDate.getFullYear();
    var monthDiff = now.getMonth() - pubDate.getMonth();
    var dayDiff = now.getDate() - pubDate.getDate();

    // 总月份差（考虑天数）
    var totalMonths = yearDiff * 12 + monthDiff;

    // 如果当前日期小于发布日期，说明还没满整月，需要减 1
    if (dayDiff < 0) {
      totalMonths -= 1;
    }

    if (totalMonths < 1) {
      // 不足 1 个月（0 个月）显示 new2.gif
      return '<img src="/niccs/pc2025/images/new2.gif" style="display:inline-block" />';
    } else if (totalMonths === 1) {
      // 满 1 个月但不足 2 个月（第二个月期间）显示 new1.gif
      return '<img src="/niccs/pc2025/images/new1.gif" style="display:inline-block" />';
    } else {
      // 满 2 个月及以上不显示图标
      return '';
    }
  }
  
  // 初始化列表渲染
  function initList(dataList) {
    if (!dataList || dataList.length === 0) return;
    
    var html = '';
    dataList.forEach(function(itemObj) {
      // 安全解析 URL
      var _url = '';
      try {
        var urlsObj = JSON.parse(itemObj.urls);
        _url = urlsObj.pc || '';

      } catch (e) {}
      
      // 安全获取附件信息
      var fileName = 'Download';
	  
      try {
        if (itemObj.articleFiles && typeof itemObj.articleFiles === 'string') {
          var files = JSON.parse(itemObj.articleFiles);
          if (files && files[0] && files[0].fileName) {
            fileName = files[0].fileName;
          }
        } else if (itemObj.articleFiles && itemObj.articleFiles[0] && itemObj.articleFiles[0].fileName) {
          fileName = itemObj.articleFiles[0].fileName;
        }
      } catch (e) {}
      
      var title = itemObj.title || '';
      var pubDate = itemObj.pubDate || 'N/A';
      var dateString = pubDate.substring(0, 10).replace(/-/g, '.');
      var redirectUrl = itemObj.redirectUrl || '';
      
      // ★新增★ 获取当前条目的图标
      var newIcon = getNewIcon(pubDate);
      
      html += '<li>\
                  <i></i>\
                  <p>' + title.substring(0, 160) + newIcon + '</p>\
                  <a href="' + redirectUrl + '" target="_blank" download="' + fileName + '">Download</a><span class="time">' + dateString + '</span>\
              </li>';
    });
    $('#data-articleList').html(html);
  }
  
  // 客户端分页
  function setupPagination() {
    if (!articleList || articleList.length === 0) {
      $('.pagination').hide();
      //initList(articleList);
      return;
    }
    
    var currentPage = 1;
    var totalPages = Math.ceil(articleList.length / pageSize);
    
    // 渲染第一页的数据
    var firstPageData = articleList.slice(0, pageSize);
    initList(firstPageData);
    
    // 如果只有一页，不显示分页
    if (totalPages <= 1) {
      $('.pagination').hide();
      return;
    }
    
    // 多于一页时，显示分页并初始化插件
    $('.pagination').show();
    var totalItems = articleList.length;
    
    console.log('准备初始化分页插件...');
    console.log('totalPages:', totalPages);
    console.log('totalItems:', totalItems);
    console.log('pageSize:', pageSize);
    
    $('.pagination').pagination({
      pageCount: totalPages,
      current: currentPage,
      jump: true,
      coping: true,
      homePage: 'Front Page',
      endPage: 'Last Page',
      count: 2,
      prevContent: '<font class="none">Previous Page</font><i class="arrow arrow-left"></i>',
      nextContent: '<font class="none">Next Page</font><i class="arrow arrow-right"></i>',
      total: true,
      totalData: totalItems,
      callback: function(api) {
        //console.log('分页 callback 被触发，当前页:', api.getCurrent());
        currentPage = api.getCurrent();
        var startIndex = (currentPage - 1) * pageSize;
        var endIndex = startIndex + pageSize;
        var pageData = articleList.slice(startIndex, endIndex);
        
        initList(pageData);
      }
    });

    console.log('分页插件初始化完成！');
  }
  
  // 执行初始化
  setupPagination();
});
</script>
